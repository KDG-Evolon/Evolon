<!DOCTYPE html>
<div th:replace="~{layout/layout :: layout(
      title='Evolon-商品一覧',
      content=~{::content},
      showHeader=true,
      showFooter=true
)}">

  <!-- ========================= -->
  <!-- メインコンテンツ -->
  <!-- ========================= -->
  <div th:fragment="content"
       xmlns:th="http://www.thymeleaf.org"
       xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- ========================= -->
    <!-- ツールバー -->
    <!-- 左：商品出品 / 右：絞り込み検索 -->
    <!-- ========================= -->
	<div class="toolbar">
	  <div class="toolbar-left">
	    <a th:href="@{/items/new}" class="button button--primary">
	      商品を出品
	    </a>
	  </div>

	  <div class="toolbar-right">
	    <button type="button" class="button secondary" id="openSearch">
	      🔍 絞り込み検索
	    </button>
	  </div>
	</div>


    <!-- ========================= -->
    <!-- 現在の検索条件表示 -->
    <!-- ========================= -->
    <div class="search-hint">
      <span th:if="${param.cardName != null and param.cardName[0] != ''}">
        カード名:
        <b th:text="${param.cardName[0]}"></b>
      </span>

      <span th:if="${param.status != null and param.status[0] != ''}">
        ステータス:
        <b th:text="${param.status[0] == 'SELLING' ? '出品中' : '売り切れ'}"></b>
      </span>
    </div>

    <!-- ========================= -->
    <!-- 検索モーダル -->
    <!-- ========================= -->
    <div class="modal-backdrop" id="searchModal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true">

        <!-- モーダルヘッダー -->
        <div class="modal-head">
          <h2 class="modal-title">絞り込み検索</h2>
          <button type="button" class="modal-close" id="closeSearch">×</button>
        </div>

        <!-- ========================= -->
        <!-- 検索フォーム -->
        <!-- ※ actionは /items/search に統一 -->
        <!-- ========================= -->
        <form th:action="@{/items/search}" method="get" class="filter-form modal-form">

          <!-- カード名 -->
          <div>
            <label>カード名</label>
            <input type="text" name="cardName" th:value="${param.cardName}">
          </div>

          <!-- レアリティ -->
          <div>
            <label>レアリティ</label>
            <select name="rarity">
              <option value="">全て</option>
              <option th:each="r : ${rarities}"
                      th:value="${r.name()}"
                      th:text="${r.label}"
                      th:selected="${param.rarity != null and param.rarity[0] == r.name()}">
              </option>
            </select>
          </div>

          <!-- レギュレーション -->
          <div>
            <label>レギュレーション</label>
            <select name="regulation">
              <option value="">全て</option>
              <option th:each="r : ${regulations}"
                      th:value="${r.name()}"
                      th:text="${r.label}"
                      th:selected="${param.regulation != null and param.regulation[0] == r.name()}">
              </option>
            </select>
          </div>

          <!-- 封入パック -->
          <div>
            <label>封入パック</label>
            <input type="text" name="packName" th:value="${param.packName}">
          </div>

          <!-- 状態 -->
          <div>
            <label>状態</label>
            <select name="condition">
              <option value="">全て</option>
              <option th:each="c : ${conditions}"
                      th:value="${c.name()}"
                      th:text="${c.label}"
                      th:selected="${param.condition != null and param.condition[0] == c.name()}">
              </option>
            </select>
          </div>

          <!-- ステータス -->
		  <div>
		    <label>ステータス</label>
		    <select name="status">
		      <option value=""
		        th:selected="${param.status == null or param.status[0] == ''}">
		        全て
		      </option>
		      <option value="SELLING"
		        th:selected="${param.status != null and param.status[0] == 'SELLING'}">
		        出品中
		      </option>
		      <option value="SOLD"
		        th:selected="${param.status != null and param.status[0] == 'SOLD'}">
		        売り切れ
		      </option>
		    </select>
		  </div>


          <!-- 価格 -->
          <div>
            <label>価格</label>
            <div class="range">
              <input type="number" name="minPrice" placeholder="最小" th:value="${param.minPrice}">
              <span>〜</span>
              <input type="number" name="maxPrice" placeholder="最大" th:value="${param.maxPrice}">
            </div>
          </div>

          <!-- 並び替え -->
          <div>
            <label>並び替え</label>
            <select name="sort">
              <option value="new" th:selected="${param.sort == null or param.sort[0] == 'new'}">
                新着順
              </option>
              <option value="priceAsc" th:selected="${param.sort != null and param.sort[0] == 'priceAsc'}">
                価格昇順
              </option>
              <option value="priceDesc" th:selected="${param.sort != null and param.sort[0] == 'priceDesc'}">
                価格降順
              </option>
            </select>
          </div>

          <!-- ボタン -->
          <div class="modal-actions">
            <a th:href="@{/items}" class="button secondary">リセット</a>
            <button type="submit" class="button">検索</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ========================= -->
    <!-- 商品一覧 -->
    <!-- ========================= -->
    <div class="item-grid">

      <!-- 商品カード -->
      <div class="item-card" th:each="item : ${items.content}">
        <a th:href="@{/items/{id}(id=${item.id})}">

          <!-- カテゴリ -->
          <span class="type-badge"
                th:text="${item.category != null ? item.category.name : 'その他'}">
          </span>

          <!-- 商品画像 -->
          <!-- imageUrl があれば表示、なければプレースホルダー -->
          <img th:if="${item.imageUrl != null}"
               th:src="@{${item.imageUrl}}"
               alt="商品画像">

          <img th:if="${item.imageUrl == null}"
               th:src="@{/images/placeholder.png}"
               alt="商品画像">

          <!-- 商品名 -->
          <h3 th:text="${item.name}"></h3>

          <!-- 価格 -->
          <p class="price"
             th:text="'¥' + ${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')}">
          </p>

          <!-- ステータス -->
		  <span class="status"
		        th:classappend="${item.status.name().toLowerCase()}"
		        th:text="${item.status.label}">
		  </span>


        </a>
      </div>

      <!-- 検索結果なし -->
      <div th:if="${items.totalElements == 0}">
        <p>商品が見つかりませんでした。</p>
      </div>
    </div>

    <!-- ========================= -->
    <!-- ページネーション -->
    <!-- ※ 検索条件を保持したまま /items/search -->
    <!-- ========================= -->
    <div class="pagination">

      <!-- 前へ -->
      <a th:if="${items.hasPrevious()}"
         th:href="@{/items/search(
            page=${items.number - 1},
            cardName=${param.cardName},
            status=${param.status},
            rarity=${param.rarity},
            regulation=${param.regulation},
            condition=${param.condition},
            packName=${param.packName},
            minPrice=${param.minPrice},
            maxPrice=${param.maxPrice},
            sort=${param.sort}
         )}">
        前へ
      </a>

      <!-- ページ番号 -->
      <span th:each="i : ${#numbers.sequence(0, items.totalPages - 1)}">
        <a th:if="${i != items.number}"
           th:href="@{/items/search(page=${i}, cardName=${param.cardName}, status=${param.status})}"
           th:text="${i + 1}">
        </a>
        <span th:if="${i == items.number}" class="current-page" th:text="${i + 1}"></span>
      </span>

      <!-- 次へ -->
      <a th:if="${items.hasNext()}"
         th:href="@{/items/search(page=${items.number + 1}, cardName=${param.cardName}, status=${param.status})}">
        次へ
      </a>
    </div>

    <!-- ========================= -->
    <!-- モーダル制御JS -->
    <!-- ========================= -->
    <script>
      const modal = document.getElementById('searchModal');
      const openBtn = document.getElementById('openSearch');
      const closeBtn = document.getElementById('closeSearch');

      openBtn.onclick = () => {
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-lock');
      };

      closeBtn.onclick = () => {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-lock');
      };

      modal.onclick = e => {
        if (e.target === modal) closeBtn.onclick();
      };

      window.onkeydown = e => {
        if (e.key === 'Escape') closeBtn.onclick();
      };
    </script>

  </div>
</div>
